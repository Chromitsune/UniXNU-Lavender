# Board description of the Xiaomi Redmi Note 7 (lavender, SDM660), read by the unixnu build driver.
# All physical values below are pinned from the phone's own interfaces: its stock
# compiled FDT (notes/lavender-fdt.dts), its GPT, and its on-device boot behaviour.

[board]
name = "lavender"
soc = "SDM660"
description = "Xiaomi Redmi Note 7 (eMMC, 4 GB DRAM, 1080x2340 panel)"
kit = "lavender"                   # the package/ of this repository appears as kits/lavender in the build tree

# The target OS image: the unchanged iPhone X (iPhone10,3 / D22AP, A11) iOS
# 16.7.16 restore image -- the target the other Kryo-260-class ports use, so the
# original userland and kexts are the well-trodden ones.
# Give --ipsw PATH to use a local file; without it the remote url is read with
# range requests, only the members that are needed.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015                  # A11 / t8015
board_id = 6                      # BuildManifest ApBoardID of the d22ap Erase identity
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# Member pins are optional; the OS/SystemOS dmgs of this image are multi-GB and
# are hashed when the userdata step is first run (add the entries then):
#   087-86698-044.dmg  (OS)
#   087-86593-047.dmg  (Cryptex1,SystemOS)

# The raw image for the userdata partition: the OS and SystemOS disk images of
# the IPSW behind a manifest. first_lba/last_lba are the GPT entry "userdata" of
# the phone (eMMC = 512-byte logical blocks, unlike UFS boards).
[userdata]
first_lba = 0xEC0100               # 15466496
last_lba = 0xE92CFFE               # 244285406
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "lavender_defconfig"
darwin_version = "22.6.0"        # Must match the iOS 16.7.16 (20H392) kernelcache ABI.

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
# early_security_init: omitted for the iPhone X. The value must point at the
# original AppleMobileFileIntegrity initializer inside *this* kernelcache's
# executable segment; the 21H461 value does not land on an instruction boundary
# in 20H392, so it cannot be carried over. Derive it from the fetched
# out/ipsw/20H392/kernelcache.decompressed before the kext-loading stage.
# early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0x..."
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# Firmware: our own RedmiNote7Pkg (built from the phone's carved stock XBL
# drivers + open EDK2 core), NOT the Mu-Silicium tree used by sheng. It lives
# at <workspace>/edk2-firmware-build and is built with the macOS clang/lld shim
# toolchain; see notes/lavender-port-plan.md for the exact build commands.
[firmware]
config = "lavender"
dsc = "RedmiNote7Pkg/RedmiNote7Pkg.dsc"
fd = "Build/RedmiNote7Pkg/{target}_GCC5/FV/REDMINOTE7PKG_UEFI.fd"
preflight = []                     # firmware bring-up is already proven on device
submodules = []
patches = []
packages = [
  "{tree}/edk2-firmware-build/edk2",
  "{tree}/edk2-firmware-build/edk2-platforms",
  "{tree}/edk2-firmware-build/RedmiNote7Pkg",
]

[firmware.defines]
DEVICE_MODEL = "lavender"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the
# kernel, its Apple device tree and the optional trust cache and Data seed.
# The loader (DarwinBoot/UniXNU.efi) boots through our firmware startup.nsh.
[payload]
volume = "LAVENDERESP"
size_mib = 192
loader = "payload"                # our phone firmware has no DarwinBoot in its FV: ship the driver on the ESP
title = "lavender first boot: source 4K XNU to console"
dram_size = "0xfe4c0000"           # size of the stock FDT memory span (0x80000000..0x17e4c0000), ~3.98 GiB
panic_screen = false
panic_recovery = true              # dynamic panic-only patch: capture to ring, show 20 s, PSCI SYSTEM_RESET, UEFI archives then requests OF
# trust_cache_sha256: sha256 of the iPhone X 20H392 StaticTrustCache and
# Cryptex1,SystemTrustCache members (derived from the IPSW).
trust_cache_sha256 = [
  "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b",
  "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361",
]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "offline-legacy-gop=1",
  "offline-hid-input=1",
]                  # first-boot bring-up set; the sheng board list is its converged stage-4 state

[payload.adt]
tool = "scripts/make-lavender-adt.py"
chip_id = "0x8015"                 # A11, what the iPhone X userland expects
owned_memory_size = "0x30000000"   # 768 MB contiguous DarwinBoot window (fits in the 4 GB device)
cpu_regs = "0,0x1,0x2,0x3,0x100,0x101,0x102,0x103"   # stock FDT /cpus reg list, boot CPU 0 first
psci_method = "smc"                # stock FDT: enable-method = "psci", method = "smc"
packed_data_ramdisk = false        # no Data ramdisk seed yet: DarwinBoot refuses a handover when the ADT declares a ramdisk slot we do not ship
iphone_identity = true
unique_chip_id = "required"        # the platform seed is not stored in any repository
# root_match_volume_uuid omitted for bring-up: the OS volume UUID only exists after the
# userdata seeding step; add it (extracted from the seeded volume) before real-root boots.

# Image parameters: AOSP v0 header, the values proven against Xiaomi's ABL by
# make-bootimg.py/bootimg.cfg (the exact set that booted the phone first try).
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
second_offset = 0xf00000
tags_offset = 0x100
pagesize = 4096
header_version = 0

# The stock bootloader expects the splash region in the device tree or it
# powers the panel off: pin the phone's own cont_splash reservation.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region@9d400000"
props = [
  { name = "label", type = "s", value = "cont_splash_mem" },
  { name = "reg", type = "x", value = ["0x0", "0x9d400000", "0x0", "0x2300000"] },
]
